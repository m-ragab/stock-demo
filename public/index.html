<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow | Inventory System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-badge">S</div>
        <div>
          <p class="eyebrow">Management Suite</p>
          <h1>StockFlow</h1>
        </div>
      </div>
      <nav class="main-nav">
        <a href="/">Dashboard</a>
        <a href="/sales">Sales</a>
        <a href="/orders">Orders</a>
        <a href="/reports">Reports</a>
      </nav>
      <div class="user-panel">
        <span id="userStatus">Not signed in</span>
        <button id="logoutBtn" class="btn btn-secondary hidden" type="button">Logout</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel auth-panel">
        <h2>Access</h2>
        <div class="switch-tabs">
          <button class="tab-btn active" data-auth="login" type="button">Login</button>
          <button class="tab-btn" data-auth="register" type="button">Register</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>
            Email
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" placeholder="••••••••" required />
          </label>
          <button class="btn" type="submit">Login</button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <label>
            Full name
            <input type="text" id="registerName" placeholder="Jane Doe" required />
          </label>
          <label>
            Email
            <input type="email" id="registerEmail" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="registerPassword" placeholder="Min 5 chars" required />
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="registerAdmin" />
            <span>Register as admin</span>
          </label>
          <button class="btn" type="submit">Create account</button>
        </form>
      </aside>

      <section class="content">
        <div class="stats-grid">
          <div class="stat-card">
            <span>Products</span>
            <strong id="productCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Customers</span>
            <strong id="customerCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Inventory Value</span>
            <strong id="inventoryValue">$0</strong>
          </div>
        </div>

        <div class="dashboard-grid">
          <section class="panel">
            <div class="panel-header">
              <h2>Products</h2>
            </div>

            <form id="productForm" class="stacked-form">
              <input type="hidden" id="productId" />
              <label>
                Product name
                <input type="text" id="productName" placeholder="Keyboard" required />
              </label>
              <label>
                Price
                <input type="number" id="productPrice" min="0" step="0.01" placeholder="200" required />
              </label>
              <label>
                Inventory stock
                <input type="number" id="productStock" min="0" step="1" placeholder="25" required />
              </label>
              <div class="button-row">
                <button class="btn" type="submit">Save product</button>
                <button id="cancelProductEdit" class="btn btn-secondary hidden" type="button">Cancel</button>
              </div>
            </form>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>Customers</h2>
            </div>

            <form id="customerForm" class="stacked-form">
              <input type="hidden" id="customerId" />
              <label>
                Customer name
                <input type="text" id="customerName" placeholder="John Smith" required />
              </label>
              <label>
                Phone
                <input type="text" id="customerPhone" placeholder="+1 555 987 1234" required />
              </label>
              <label class="checkbox-row">
                <input type="checkbox" id="customerGold" />
                <span>Gold customer</span>
              </label>
              <div class="button-row">
                <button class="btn" type="submit">Save customer</button>
                <button id="cancelCustomerEdit" class="btn btn-secondary hidden" type="button">Cancel</button>
              </div>
            </form>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="customerTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
